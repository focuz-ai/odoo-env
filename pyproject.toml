# ═══════════════════════════════════════════════════════════════════════════
# Configuración de herramientas de análisis de código para Odoo
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Mypy - Deshabilitado para Odoo (conflicto con Odoo IDE, sin type stubs)
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
# Ignorar errores de imports sin tipos (librerías sin stubs)
ignore_missing_imports = true
# Deshabilitar códigos de error específicos
disable_error_code = ["import-untyped", "import-not-found"]
# No verificar módulos sin anotaciones de tipos
check_untyped_defs = false

# ─────────────────────────────────────────────────────────────────────────────
# Pyright - Configuración para Odoo IDE
# NOTA: pyrightconfig.json TIENE PRECEDENCIA sobre esta sección cuando existe
# (es el que carga el Odoo IDE). Se mantiene aquí solo como fallback. Si superas
# ~150k archivos en el scope, Pyright aborta la indexación y deja de resolver:
# por eso se excluyen i18n/static-lib/migrate y se acota `include`.
# ─────────────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["odoo", "enterprise", "design-themes", "vendor/OCA", "src/dev", "src/projects"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "**/i18n", "**/static/lib", "src/migrate", "documentation", "industry", "_tmp", "reports"]
extraPaths = ["odoo", "odoo/addons", "enterprise", "design-themes", "vendor/OCA", "src/dev/focuz-ai/l10n-pe", "src/dev/focuz-ai/enterprise", "src/dev/focuz-ai/odoo-oca"]

venvPath = "."
venv = ".venv"

# Type checking básico (recomendado por Odoo IDE)
typeCheckingMode = "basic"
pythonVersion = "3.12"

# Usar código de librería para tipos cuando no hay stubs
useLibraryCodeForTypes = true

# Suprimir todos los warnings (false = deshabilitado)
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportMissingImports = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportPrivateUsage = false
reportGeneralTypeIssues = false
reportAttributeAccessIssue = false
reportOperatorIssue = false
reportArgumentType = false
